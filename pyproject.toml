[project]
name = "studybuddy"
version = "0.1.0"
description = "Local RAG chat over university lecture slides"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain",
    "langchain-text-splitters",
    "langchain-ollama",
    "langgraph",
    "chromadb",
    "pymupdf4llm",
    "pymupdf",
    "scikit-learn",
    "umap-learn",
    "ddgs",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studybuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
