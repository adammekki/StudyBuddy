<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaiaGPT</title>
<style>
  :root {
    --bg: #08090b;
    --ink: #e6e8ec;
    --dim: #8a919e;
    --faint: #3a4049;
    --accent: #7dd3fc;
    --panel: #11141a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #jelly { position: fixed; inset: 0; opacity: .13; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem 1.25rem;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  header strong { font-weight: 600; letter-spacing: .01em; }
  #status { flex: 1; font-size: 12px; color: var(--dim); }
  #reindex {
    background: none; border: 1px solid var(--faint); color: var(--dim);
    font: inherit; font-size: 12px; padding: .25rem .6rem; border-radius: 6px; cursor: pointer;
  }
  #reindex:hover { color: var(--ink); border-color: var(--dim); }
  #log {
    flex: 1; width: 100%; max-width: 820px; margin: 0 auto;
    padding: 1rem 1.25rem 2rem; display: flex; flex-direction: column; gap: 1.6rem;
  }
  .turn { display: flex; flex-direction: column; }
  .user { align-self: flex-end; max-width: 85%; background: var(--panel); padding: .6rem .85rem; border-radius: 10px; white-space: pre-wrap; }
  .bot { align-self: flex-start; max-width: 100%; white-space: pre-wrap; }
  .bot.web { border-left: 2px solid #d97706; padding-left: .9rem; }
  .bot.bad { color: #fca5a5; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-bottom: .25rem; }
  .sources { margin-top: .45rem; font-size: 11.5px; line-height: 1.5; color: var(--dim); }
  .sources a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--faint); }
  .sources a:hover { color: var(--accent); border-color: var(--accent); }
  .sources span + span::before { content: " · "; color: var(--faint); }
  .pending { color: var(--dim); font-size: 13px; font-style: italic; }
  form {
    position: sticky; bottom: 0; z-index: 2;
    width: 100%; max-width: 820px; margin: 0 auto;
    padding: .75rem 1.25rem 1.25rem; display: flex; gap: .6rem;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
  }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px;
    padding: .7rem .85rem; border-radius: 10px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--faint); font: inherit; line-height: 1.45;
  }
  textarea:focus { outline: none; border-color: var(--dim); }
  textarea::placeholder { color: var(--faint); }
  button[type=submit] {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 10px;
    padding: 0 1.1rem; font: inherit; cursor: pointer;
  }
  button[type=submit]:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<canvas id="jelly" aria-hidden="true"></canvas>
<div id="app">
  <header>
    <strong>MaiaGPT</strong>
    <span id="status">loading…</span>
    <button id="reindex" type="button">Reindex</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask about your slides…" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const HISTORY_KEY = 'studybuddy_history';

const history = () => JSON.parse(sessionStorage.getItem(HISTORY_KEY) || '[]');
const remember = (role, content) => {
  const next = [...history(), { role, content }].slice(-12);
  sessionStorage.setItem(HISTORY_KEY, JSON.stringify(next));
};

function turn(role, text, cls) {
  const wrapper = document.createElement('div');
  wrapper.className = `turn ${role}`;
  if (role === 'bot' && cls) wrapper.classList.add(cls);
  if (role === 'bot') {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = cls === 'web' ? 'from the web' : 'from your slides';
    wrapper.appendChild(who);
  }
  const body = document.createElement('div');
  body.textContent = text;
  wrapper.appendChild(body);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return wrapper;
}

function footnote(wrapper, parts) {
  const line = document.createElement('div');
  line.className = 'sources';
  parts.forEach((part, index) => {
    const span = document.createElement('span');
    if (part.href) {
      const a = document.createElement('a');
      a.href = part.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = part.text;
      span.appendChild(a);
    } else {
      span.textContent = part.text;
    }
    line.appendChild(span);
  });
  wrapper.appendChild(line);
}

async function refreshStatus() {
  try {
    const s = await (await fetch('/status')).json();
    const decks = s.decks?.length ?? 0;
    statusEl.textContent = s.state === 'building'
      ? 'rebuilding index…'
      : `${decks} deck${decks === 1 ? '' : 's'} · ${s.chunks ?? 0} chunks`;
  } catch {
    statusEl.textContent = 'server not reachable';
  }
}

document.getElementById('reindex').addEventListener('click', async () => {
  await fetch('/reindex', { method: 'POST' });
  refreshStatus();
});

function autogrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
}
input.addEventListener('input', autogrow);
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    document.getElementById('form').requestSubmit();
  }
});

document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;
  input.value = '';
  autogrow();
  sendBtn.disabled = true;

  turn('user', message);
  const pending = document.createElement('div');
  pending.className = 'pending';
  pending.textContent = 'searching your slides…';
  log.appendChild(pending);
  log.scrollTop = log.scrollHeight;

  let answerNode = null;
  let sawDone = false;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message, history: history(), session_id: 'local' }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === 'answer') {
          pending.remove();
          answerNode = turn('bot', event.text, event.source === 'web' ? 'web' : '');
        } else if (event.type === 'sources' && answerNode) {
          footnote(answerNode, event.items.map((s) => ({
            text: `${s.deck} p.${s.page}`,
            href: `/deck/${encodeURIComponent(s.deck)}#page=${s.page}`,
          })));
        } else if (event.type === 'notice' && answerNode) {
          footnote(answerNode, [{ text: event.text }]);
        } else if (event.type === 'error') {
          pending.remove();
          answerNode = turn('bot', event.message, 'bad');
        } else if (event.type === 'done') {
          sawDone = true;
        }
      }
    }
  } catch (error) {
    pending.remove();
    turn('bot', 'Connection lost: ' + error.message, 'bad');
  }

  if (!sawDone) {
    pending.remove();
    if (!answerNode) turn('bot', 'Connection lost before the answer finished.', 'bad');
  }
  pending.remove();

  remember('user', message);
  if (answerNode) remember('assistant', answerNode.textContent);
  sendBtn.disabled = false;
  input.focus();
  refreshStatus();
});

/* Animated ASCII sea: jellyfish, fish, bubbles, seaweed. */
(() => {
  const canvas = document.getElementById('jelly');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let width = 0, height = 0;

  const jellies = Array.from({ length: 3 }, (_, i) => ({
    x: 0.22 + i * 0.28,
    y: 0.3 + i * 0.24,
    r: 26 + i * 9,
    drift: 0.00013 + i * 0.00004,
    phase: i * 2.1,
  }));

  const fish = [
    { x: 0.15, y: 0.3, speed: 0.000035, dir: 1, phase: 0.4 },
    { x: 0.75, y: 0.52, speed: 0.000024, dir: -1, phase: 2.1 },
    { x: 0.45, y: 0.72, speed: 0.000045, dir: 1, phase: 4.3 },
  ];

  const bubbles = Array.from({ length: 22 }, (_, i) => ({
    x: Math.random(),
    y: Math.random(),
    speed: 0.000012 + Math.random() * 0.000018,
    wobble: 6 + Math.random() * 14,
    phase: i * 1.7,
    glyph: i % 3 === 0 ? 'o' : '°',
  }));

  const weeds = Array.from({ length: 26 }, (_, i) => ({
    x: (i + 0.5) / 26,
    height: 0.06 + ((i * 7) % 5) * 0.012,
    phase: i * 0.9,
  }));

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth;
    height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9ad7ef';
  }

  function drawJelly(j, t) {
    const roamX = Math.sin(t * j.drift + j.phase) * width * 0.16;
    const roamY = Math.cos(t * j.drift * 0.8 + j.phase * 1.3) * height * 0.13;
    const cx = j.x * width + roamX;
    const cy = j.y * height + roamY;
    const bob = Math.sin(t * 0.0011 + j.phase) * 7;
    const rx = j.r * (1 + Math.sin(t * 0.0016 + j.phase) * 0.06);
    const ry = j.r * 0.62;

    for (let a = 0; a <= Math.PI; a += 0.075) {
      const x = cx + Math.cos(a) * rx;
      const y = cy + bob - Math.sin(a) * ry;
      ctx.fillText(Math.sin(a) > 0.6 ? '=' : '-', x, y);
    }
    for (let x = -rx; x <= rx; x += 11) {
      ctx.fillText('.', cx + x, cy + bob + 1);
    }
    for (let i = 0; i < 5; i++) {
      const offset = -rx * 0.75 + (i * rx * 1.5) / 4;
      for (let k = 1; k <= 7; k++) {
        const wave = Math.sin(t * 0.0013 + j.phase + k * 0.6 + i) * 3.5;
        ctx.fillText(k % 2 ? '|' : ':', cx + offset + wave, cy + bob + k * 9);
      }
    }
  }

  function drawFish(f, t) {
    const travel = ((f.x + t * f.speed * f.dir) % 1.2 + 1.2) % 1.2 - 0.1;
    const cx = travel * width;
    const cy = f.y * height + Math.sin(t * 0.0009 + f.phase) * 10;
    ctx.fillText(f.dir > 0 ? '><>' : '<><', cx, cy);
  }

  function drawBubbles(t) {
    bubbles.forEach((b) => {
      const y = ((b.y - t * b.speed) % 1 + 1) % 1;
      const x = b.x * width + Math.sin(t * 0.0011 + b.phase) * b.wobble;
      ctx.globalAlpha = Math.min(1, Math.max(0, y * 2.2));
      ctx.fillText(b.glyph, x, y * height);
      ctx.globalAlpha = 1;
    });
  }

  function drawSeaweed(t) {
    weeds.forEach((w) => {
      const baseX = w.x * width;
      const baseY = height - 8;
      const chars = Math.round(height * w.height / 12);
      for (let k = 0; k < chars; k++) {
        const sway = Math.sin(t * 0.0012 + w.phase + k * 0.45) * (k * 0.8);
        const glyph = k % 4 === 0 ? '(' : k % 4 === 1 ? ')' : k % 4 === 2 ? '|' : '{';
        ctx.fillText(glyph, baseX + sway, baseY - k * 12);
      }
    });
  }

  function drawScene(t) {
    ctx.clearRect(0, 0, width, height);
    drawSeaweed(t);
    drawBubbles(t);
    fish.forEach((f) => drawFish(f, t));
    jellies.forEach((j) => drawJelly(j, t));
  }

  function frame(t) {
    drawScene(t);
    requestAnimationFrame(frame);
  }

  resize();
  addEventListener('resize', resize);
  if (reduce.matches) {
    requestAnimationFrame(() => drawScene(1000));
  } else {
    requestAnimationFrame(frame);
  }
})();

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
